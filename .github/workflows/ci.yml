name: Quality
on:
  pull_request:
  push:
    branches: [developer, main, devWilson]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm check:structure
      - run: pnpm sql:check
      - run: pnpm sql:reports:check
      - run: pnpm er:check
      - run: pnpm test:scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @techcare/api test:e2e --runInBand
      - run: pnpm build
