packages:
  - apps/*

# Correcciones de seguridad transitivas, sin actualizar Nest ni cambiar su API.
overrides:
  '@nestjs/platform-express>multer': '2.5.0'
  '@nestjs/swagger>js-yaml': '5.4.1'
  # ExcelJS usa uuid.v4; 11.1.1 conserva entrada CommonJS y corrige limites.
  'exceljs>uuid': '11.1.1'
  # Uso actual: SQL login, no auth_code. Validar carga del driver/Identity y
  # suite completa antes de cambiar estos pins o habilitar autenticacion Entra.
  '@azure/identity>@azure/msal-node': '7.1.0'

onlyBuiltDependencies:
  - argon2
  - '@tailwindcss/oxide'
  - esbuild
